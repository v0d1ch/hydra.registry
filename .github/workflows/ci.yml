name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hydra_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true

      - name: Cache nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Cache cabal
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            api/dist-newstyle
          key: cabal-${{ runner.os }}-${{ hashFiles('api/hydra-registry-api.cabal', 'api/cabal.project') }}
          restore-keys: cabal-${{ runner.os }}-

      - name: Build
        run: nix develop --command bash -c "cd api && cabal build all"

      - name: Run all tests
        env:
          TEST_DB_CONN_STR: "host=localhost port=5432 dbname=hydra_registry_test user=postgres password=postgres"
        run: nix develop --command bash -c "cd api && cabal test --test-show-details=direct"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Type check
        run: cd website && npx tsc --noEmit

      - name: Build
        run: cd website && npx vite build
